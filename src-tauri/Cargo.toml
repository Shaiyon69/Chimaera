[package]
name = "chimaera"
version = "1.0.3"
description = "Chimaera game launcher (Tauri shell)"
edition = "2021"
license = "MIT"

[lib]
name = "chimaera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2"
serde_json = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastrand = "2"
rusty-leveldb = "3"
sha2 = "0.10"
percent-encoding = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["time", "macros"] }
base64 = "0.22"
unicode-normalization = "0.1"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
lnk = "0.6"
winreg = "0.56"
encoding_rs = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
