[package]
name = "chimaera"
version = "2.5.2"
description = "Chimaera game launcher (Tauri shell)"
edition = "2021"
license = "MIT"

[lib]
name = "chimaera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.8"
tauri-plugin-updater = "2.14"
serde_json = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastrand = "2"
rusty-leveldb = "3"
sha2 = "0.10"
percent-encoding = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1", features = ["time", "macros", "sync", "net", "io-util"] }
base64 = "0.22"
unicode-normalization = "0.1"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
serde_yaml = "0.9"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# shaiyon-core is private: locally git's credential manager fetches it, CI rewrites the URL to SSH with a deploy key.
shaiyon-crypto = { git = "https://github.com/Shaiyon69/shaiyon-core", tag = "v0.4.0" }
shaiyon-keys = { git = "https://github.com/Shaiyon69/shaiyon-core", tag = "v0.4.0" }
chd = "0.4.0"
flate2 = "1.1.10"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
lnk = "0.6"
winreg = "0.56"
encoding_rs = "0.8"
xcap = { version = "0.9", features = ["wgc"] }
# Same versions wry uses; for the WebView2 memory target level (webview_memory.rs).
webview2-com = "0.39"
windows = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true

# From Pake: no debug info for dependencies keeps dev builds and target/ much smaller.
# Backtraces and breakpoints in Chimaera's own code are unchanged.
[profile.dev.package."*"]
debug = false

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
