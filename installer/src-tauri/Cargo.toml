[package]
name = "chimaera-setup"
version = "1.0.0"
description = "Chimaera Setup: installs the newest signed Chimaera from Skibidevs"
edition = "2021"

# Standalone: not part of Chimaera's src-tauri build.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
minisign-verify = "0.2"
base64 = "0.22"

[features]
# Plain `cargo build` serves ../ui from the binary; no Tauri CLI needed in CI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
