name: Tauri release

# Builds the signed Windows installer and Linux AppImage plus the updater latest.json, then publishes them as the
# chimaera-v<version> release on Shaiyon69/Skibidevs. Binaries ship only from the website, never from this repo.
# SKIBIDEVS_TOKEN: fine-grained token with Contents read/write on Shaiyon69/Skibidevs only.
# BROOD_SSH_KEY: read-only deploy key for Shaiyon69/Chimaera-Brood (the game companions).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release on Skibidevs (off = build and keep the artifact only)
        type: boolean
        default: true

concurrency:
  group: tauri-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
      SITE_REPO: Shaiyon69/Skibidevs
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
      RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
      RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
      # scripts/fetch-companions.mjs builds the companions from this checkout.
      CHIMAERA_COMPANIONS_DIR: ${{ github.workspace }}/brood
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out the companions
        uses: actions/checkout@v4
        with:
          repository: Shaiyon69/Chimaera-Brood
          ssh-key: ${{ secrets.BROOD_SSH_KEY }}
          path: brood

      # src-tauri depends on the private shaiyon-core (shaiyon-keys) by git tag.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SKIBI_CORE_SSH_KEY }}

      - name: Fetch private shaiyon-core over SSH
        run: git config --global url."git@github.com:Shaiyon69/shaiyon-core".insteadOf "https://github.com/Shaiyon69/shaiyon-core"

      - name: Check release configuration
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret (the key for the updater pubkey in tauri.conf.json)"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Set the SKIBIDEVS_TOKEN secret"; exit 1; }
          test -n "$MAIN_VITE_API_URL" || { echo "::error::Set the MAIN_VITE_API_URL repository variable"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            brood -> target
            installer/src-tauri -> ../target

      # dx builds the companion web apps; rust-cache keeps ~/.cargo/bin, so this installs once.
      - name: Install Dioxus CLI
        run: |
          rustup target add wasm32-unknown-unknown
          dx --version 2>/dev/null | grep -q "0.7.10" || cargo install dioxus-cli --version 0.7.10 --locked

      # The companion bundle downloads wiki pages and pictures; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/terraria-guide
          key: companion-wiki-${{ hashFiles('brood/terraria-guide/assets/progression.json') }}
          restore-keys: companion-wiki-

      # The postinstall hook builds the frozen Electron addon; Tauri only needs ludusavi from it.
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          node scripts/postinstall.cjs

      # build.rs reads the API URL and the Drive OAuth client from .env at compile time.
      - name: Write build-time .env
        run: |
          {
            echo "MAIN_VITE_API_URL=$MAIN_VITE_API_URL"
            [ -z "$MAIN_VITE_GOOGLE_CLIENT_ID" ] || echo "MAIN_VITE_GOOGLE_CLIENT_ID=$MAIN_VITE_GOOGLE_CLIENT_ID"
            [ -z "$MAIN_VITE_GOOGLE_CLIENT_SECRET" ] || echo "MAIN_VITE_GOOGLE_CLIENT_SECRET=$MAIN_VITE_GOOGLE_CLIENT_SECRET"
          } > .env

      # Updater artifacts are switched on here only, so local `yarn tauri:build` needs no signing key.
      # tauri:build builds and bundles the companions first.
      - name: Build signed installer
        run: |
          yarn tauri:build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          test -f resources/companions/terraria/_data/pages.json || { echo "::error::Terraria Guide bundle missing"; exit 1; }

      # Renamed to the site's download pattern (data/apptic.json: ^chimaera-.*-setup\.exe$).
      - name: Collect release files
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir release
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$exe" "release/chimaera-$VERSION-setup.exe"
          cp "$exe.sig" "release/chimaera-$VERSION-setup.exe.sig"

      # Chimaera Setup: the website's Windows download. It fetches the newest signed installer
      # from Skibidevs at run time, checks it against the updater key and installs it.
      - name: Build Chimaera Setup
        run: |
          cargo build --release --manifest-path installer/src-tauri/Cargo.toml --target-dir installer/target
          cp installer/target/release/chimaera-setup.exe release/Chimaera-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: chimaera-windows
          if-no-files-found: error
          path: release/*

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
      SITE_REPO: Shaiyon69/Skibidevs
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL }}
      MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_ID }}
      MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ vars.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
      RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
      RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
      # scripts/fetch-companions.mjs builds the companions from this checkout.
      CHIMAERA_COMPANIONS_DIR: ${{ github.workspace }}/brood
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out the companions
        uses: actions/checkout@v4
        with:
          repository: Shaiyon69/Chimaera-Brood
          ssh-key: ${{ secrets.BROOD_SSH_KEY }}
          path: brood

      # src-tauri depends on the private shaiyon-core (shaiyon-keys) by git tag.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SKIBI_CORE_SSH_KEY }}

      - name: Fetch private shaiyon-core over SSH
        run: git config --global url."git@github.com:Shaiyon69/shaiyon-core".insteadOf "https://github.com/Shaiyon69/shaiyon-core"

      - name: Check release configuration
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret (the key for the updater pubkey in tauri.conf.json)"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Set the SKIBIDEVS_TOKEN secret"; exit 1; }
          test -n "$MAIN_VITE_API_URL" || { echo "::error::Set the MAIN_VITE_API_URL repository variable"; exit 1; }

      # Tauri's WebKitGTK stack, dbus for the keyring, xdo for the companion build, GStreamer for the AppImage's media framework.
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev patchelf xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            brood -> target

      # dx builds the companion web apps; rust-cache keeps ~/.cargo/bin, so this installs once.
      - name: Install Dioxus CLI
        run: |
          rustup target add wasm32-unknown-unknown
          dx --version 2>/dev/null | grep -q "0.7.10" || cargo install dioxus-cli --version 0.7.10 --locked

      # The companion bundle downloads wiki pages and pictures; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/terraria-guide
          key: companion-wiki-${{ hashFiles('brood/terraria-guide/assets/progression.json') }}
          restore-keys: companion-wiki-

      # The postinstall hook builds the frozen Electron addon; Tauri only needs ludusavi from it.
      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          node scripts/postinstall.cjs

      # build.rs reads the API URL and the Drive OAuth client from .env at compile time.
      - name: Write build-time .env
        run: |
          {
            echo "MAIN_VITE_API_URL=$MAIN_VITE_API_URL"
            [ -z "$MAIN_VITE_GOOGLE_CLIENT_ID" ] || echo "MAIN_VITE_GOOGLE_CLIENT_ID=$MAIN_VITE_GOOGLE_CLIENT_ID"
            [ -z "$MAIN_VITE_GOOGLE_CLIENT_SECRET" ] || echo "MAIN_VITE_GOOGLE_CLIENT_SECRET=$MAIN_VITE_GOOGLE_CLIENT_SECRET"
          } > .env

      # linuxdeploy's strip cannot read newer ELF sections (the torrent bridge); stripping is optional.
      - name: Build signed AppImage
        env:
          NO_STRIP: "true"
        run: |
          yarn tauri:build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
          test -f resources/companions/terraria/_data/pages.json || { echo "::error::Terraria Guide bundle missing"; exit 1; }

      # Renamed to the site's download pattern (data/apptic.json: ^chimaera-.*\.AppImage$).
      - name: Collect release files
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          mkdir release
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          cp "$app" "release/chimaera-$VERSION-amd64.AppImage"
          cp "$app.sig" "release/chimaera-$VERSION-amd64.AppImage.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: chimaera-linux
          if-no-files-found: error
          path: release/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.SKIBIDEVS_TOKEN }}
      SITE_REPO: Shaiyon69/Skibidevs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: chimaera-*
          path: release
          merge-multiple: true

      - name: Write updater manifest
        run: |
          export VERSION=$(node -p 'require("./package.json").version')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const base = `https://github.com/Shaiyon69/Skibidevs/releases/download/chimaera-v${version}`;
            const entry = (file) => ({ signature: fs.readFileSync(`release/${file}.sig`, "utf8").trim(), url: `${base}/${file}` });
            const manifest = {
              version,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": entry(`chimaera-${version}-setup.exe`),
                "linux-x86_64": entry(`chimaera-${version}-amd64.AppImage`),
              },
            };
            fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: release/latest.json

      - name: Publish Skibidevs release
        if: inputs.publish
        run: |
          TAG="chimaera-v$VERSION"
          if gh release view "$TAG" --repo "$SITE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$SITE_REPO"
          else
            gh release create "$TAG" release/* --title "Chimaera v$VERSION" --notes "Chimaera v$VERSION" --repo "$SITE_REPO"
          fi

      # The site refreshes its download list and updater manifests on this event.
      - name: Tell Skibidevs to refresh
        if: inputs.publish
        run: gh api "repos/$SITE_REPO/dispatches" -f event_type=app-released
